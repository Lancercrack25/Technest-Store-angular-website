<main class="client-register">
  <div class="client-card-container">
    <div class="client-card" aria-labelledby="register-title">
      <!-- Logo -->
      <div class="logo-container" aria-hidden="true">
        <div class="logo-box">TechNest</div>
      </div>

      <!-- Title -->
      <header class="client-header">
        <h1 id="register-title" class="client-title">Crear cuenta</h1>
        <p class="client-subtitle">Completa tus datos para registrarte</p>
      </header>

      <!-- Form -->
      <form class="client-form" (ngSubmit)="registrar()" novalidate>
        <div class="input-group">
          <label for="nombre">Usuario</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            placeholder="Tu usuario"
            [(ngModel)]="form.nombre"
            autocomplete="username"
            required
          />
        </div>

        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="form.email"
            autocomplete="email"
            required
          />
        </div>

        <div class="input-group">
          <label for="telefono">Teléfono</label>
          <input
            id="telefono"
            name="telefono"
            type="tel"
            placeholder="Tu número"
            min="1"
            [(ngModel)]="form.telefono"
            autocomplete="tel"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              [(ngModel)]="form.password"
              autocomplete="new-password"
              required
            />
            <button class="toggle-password" type="button" aria-label="Mostrar contraseña">
              <span class="eye-icon" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="password-wrapper">
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="••••••••"
              [(ngModel)]="confirmPassword"
              autocomplete="new-password"
              required
            />
            <button class="toggle-password" type="button" aria-label="Mostrar contraseña">
              <span class="eye-icon" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>

        <!-- Actions -->
        <button class="btn-primary" type="submit">Registrarse</button>
        <a class="btn-secondary" routerLink="/">Regresar</a>
      </form>
    </div>
  </div>
</main>
