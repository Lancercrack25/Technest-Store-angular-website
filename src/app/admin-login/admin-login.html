<!-- Admin Login -->
<main class="admin-login">
  <div class="admin-card-container">
    <div class="admin-card" aria-labelledby="admin-title">
      <!-- Logo -->
      <div class="logo-container" aria-hidden="true">
        <div class="logo-box">TechNest</div>
      </div>

      <!-- Title -->
      <header class="admin-header">
        <h1 id="admin-title" class="admin-title">
          Admin Login
          <span class="shield-icon" aria-hidden="true">⛨</span>
        </h1>
        <p class="admin-subtitle">Acceso al panel de administrador</p>
      </header>

      <!-- Form -->
      <form class="admin-form" action="#" method="post" novalidate>
        <!-- Email -->
        <div class="input-group">
          <label for="email">Correo electronico</label>
          <input id="email" name="email" type="email" placeholder="admin@technest.com" autocomplete="email" required />
        </div>

        <!-- Password -->
        <div class="input-group">
          <label for="password">Contraseña</label>

          <div class="password-wrapper">
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password"
              required />

            <!-- Botón para mostrar/ocultar (tú lo conectas con JS si quieres) -->
            <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
              <span class="eye-icon" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>

        <!-- Options row -->
        <div class="options-row">
          <label class="remember-me">
            <input id="remember" name="remember" type="checkbox" />
            <span>Recuerdame</span>
          </label>

          <a class="forgot-link" href="#">¿Olvidó la contraseña?</a>
        </div>

        <!-- Primary action -->
        <button class="btn-primary" type="submit">Iniciar sesión</button>

        <!-- Secondary action -->
        <a class="btn-secondary" href="#">Regresar a la tienda</a>
      </form>
    </div>
  </div>
</main>
