<main class="admin-login">
  <div class="admin-card-container">
    <div class="admin-card" aria-labelledby="admin-title">

      <div class="logo-container" aria-hidden="true">
        <div class="logo-box">TechNest</div>
      </div>

      <header class="admin-header">
        <h1 id="admin-title" class="admin-title">
          Admin Login
          <span class="shield-icon" aria-hidden="true">⛨</span>
        </h1>
        <p class="admin-subtitle">Acceso al panel de administrador</p>
      </header>

      <form class="admin-form" (ngSubmit)="login()" novalidate>

        <div class="input-group">
          <label for="adminame">Nombre de administrador</label>
          <input id="adminame" name="adminame" type="text"
            placeholder="Nombre del admin"
            [(ngModel)]="credentials.nombre"
            autocomplete="username" required />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input id="password" name="password"
              [type]="mostrarPassword ? 'text' : 'password'"
              placeholder="••••••••"
              [(ngModel)]="credentials.password"
              autocomplete="current-password" required />
            <button class="toggle-password" type="button"
              (click)="mostrarPassword = !mostrarPassword"
              aria-label="Show password">
              <span class="eye-icon" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>

        <div class="btn-container">
          <button class="btn-primary" type="submit">Iniciar sesión</button>
          <button class="btn-secondary" type="button" routerLink="/">Regresar a la tienda</button>
        </div>

      </form>
    </div>
  </div>
</main>
