<!-- Esto sirve para definir los estilos globales de cada componente  por individual -->
<!-- recuerden que cada que definan un nuevo componente agreguenlo aqui al div para poder darl estilos según la ruta -->
<!--'nombre de la clase para el css global': router.url === '/ruta-del-componente creado'   -->
<div [ngClass]="{
  'login': router.url === '/',
  'registro': router.url === '/registro',
  'inicio': router.url === '/inicio',
  'navbar': router.url === '/navbar',
  'footer': router.url === '/footer',
  'cliente-perfil': router.url === '/cliente/perfil',
  'carrito': router.url === '/carrito',
  'productos': router.url === '/productos',
  'recomendador': router.url === '/recomendador',
  'pedidos': router.url === '/pedidos',
  'ventas': router.url === '/ventas',
  'registro-productos': router.url === '/registro/productos',
  'registro-provedores': router.url === '/registro/provedores',
  'admin-panel': router.url === '/admin/panel',
  'clientes': router.url === '/clientes',
  'provedores': router.url === '/provedores',
  'admin-productos': router.url === '/admin/productos',
  'admin-ventas': router.url === '/admin/ventas',
  'admin-pedidos': router.url === '/admin/pedidos'
}">
  <!-- no borrar esta linea -->
  <router-outlet></router-outlet>
</div>
