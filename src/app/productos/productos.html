<app-navbars></app-navbars>

<div class="contenedor-productos">

    @for (producto of productos; track producto.id_producto) {

    <div class="card-producto">

        <img
            [src]="producto.imagen"
            alt="Producto"
            class="imagen-producto"
        />

        <h2>{{ producto.nombre }}</h2>

        <p class="descripcion">
        {{ producto.descripcion }}
        </p>

        <p class="precio">
        $ {{ producto.precio }}
        </p>

        <button (click)="agregarAlCarrito(producto)">
        Agregar al carrito
        </button>

    </div>

    }

</div>
