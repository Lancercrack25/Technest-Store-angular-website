<section class="forgot-password">
  <div class="forgot-card">
    <div class="logo-container" aria-hidden="true">
      <div class="logo-box">TechNest</div>
    </div>

    <h1 class="title">¿Olvidaste tu contraseña?</h1>
    <p class="subtitle">
      Escribe tu correo y te enviaremos un enlace para restablecerla.
    </p>

    <div class="form">
      <label class="label" for="email">Correo</label>
      <input id="email" class="input" type="email" placeholder="tu-correo@ejemplo.com" autocomplete="email" />

      <div class="btn-container">
        <!-- Primary action -->
        <button class="btn-primary" type="button">Enviar enlace</button>
        <!-- Cambiar a submit si se requiere una acción -->

        <!-- Secondary action -->
        <button class="btn-secondary" type="button" routerLink="/">Volver a iniciar sesión</button>
      </div>

      <a class="link" routerLink="/register">¿No tienes cuenta? Crear una</a>
    </div>
  </div>
</section>
